name: "MinVandforsyning"
version: "1.0.0"
slug: "minvandforsyning"
description: "Hent vandforbrugsdata fra minvandforsyning.dk — virker med alle vandværker (Greve, Hvidovre, m.fl.)"
url: "https://github.com/henrikastrup1/ha-greve-vand-addon"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
init: false
homeassistant_api: true
auth_api: true
hassio_role: "default"
options:
  url: "https://www.minvandforsyning.dk/?SK=grv"
  email: ""
  password: ""
  sensor_name: "sensor.vandforbrug"
  interval_minutes: 120
schema:
  url: url
  email: str
  password: password
  sensor_name: str
  interval_minutes: int(60, 1440)
